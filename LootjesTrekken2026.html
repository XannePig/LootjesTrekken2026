<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lootjes trekken</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Figtree:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* VOICE: warm, familiar, a bit festive — a family table in December
   IDEA: a folded paper lootje pulled from a hat
   PICTURE: the tool itself; on the reveal, one big folded ticket that opens
   COLOUR and TYPE: deep Christmas red, snow white, gold accent; Fraunces + Figtree
   LAYOUT: one calm column, steps 1-2-3 for the owner, a single object for the reveal */
:root{color-scheme:light dark;--bg:light-dark(#fbf7f4,#1a0a0e);--card:light-dark(#fff,#2a1217);--ink:light-dark(#2a0c12,#fbeff0);--mute:light-dark(#7a5a60,#c9a9ae);--red:#a3122a;--red2:light-dark(#7d0c1f,#d2344d);--gold:#e0a526;--line:light-dark(#ecdcdf,#43242b)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Figtree,system-ui,sans-serif;overflow-x:clip}
header{background:var(--red);color:#fff;padding:clamp(28px,5vw,56px) max(5vw,16px) clamp(40px,6vw,72px);position:relative;overflow:hidden}
header svg.snow{position:absolute;inset:0;width:100%;height:100%;opacity:.18;pointer-events:none}
h1{font:800 clamp(34px,7vw,52px)/1.05 Fraunces,Georgia,serif;margin:0 0 8px;text-wrap:balance;position:relative}
header p{margin:0;max-width:60ch;position:relative;opacity:.92}
main{max-width:720px;margin:-28px auto 0;padding:0 16px 64px;position:relative}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:clamp(18px,3vw,28px);margin-bottom:18px;box-shadow:0 8px 24px -16px rgba(80,0,20,.35)}
h2{font:600 22px/1.2 Fraunces,Georgia,serif;margin:0 0 6px}
.step{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--gold);color:#2a0c12;font:700 14px Figtree;margin-right:8px;vertical-align:2px}
.hint{color:var(--mute);font-size:14px;margin:0 0 14px}
.row{display:flex;gap:8px;flex-wrap:wrap}
input[type=text]{flex:1 1 180px;font:16px Figtree;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);min-height:46px}
input:focus-visible,button:focus-visible,a:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
button,.btn{font:600 16px Figtree;min-height:46px;padding:0 18px;border-radius:12px;border:0;background:var(--red);color:#fff;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px}
button.ghost,.btn.ghost{background:transparent;color:var(--red2);border:1px solid var(--line)}
button.big{width:100%;font-size:18px;min-height:54px;margin-top:6px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 6px 6px 14px;border-radius:999px;background:var(--bg);border:1px solid var(--line);font-weight:600}
.chip button{min-height:32px;width:32px;padding:0;border-radius:50%;background:transparent;color:var(--mute);font-size:18px}
.ex{border-top:1px solid var(--line);padding:14px 0}
.ex:first-of-type{border-top:0}
.ex b{display:block;margin-bottom:8px}
.tog{min-height:38px;padding:0 14px;border-radius:999px;font-size:15px;background:var(--bg);color:var(--ink);border:1px solid var(--line)}
.tog[aria-pressed=true]{background:var(--red2);color:#fff;border-color:transparent;text-decoration:line-through}
label.check{display:flex;gap:10px;align-items:center;margin-bottom:6px;font-size:15px}
label.check input{width:20px;height:20px;accent-color:var(--red)}
.out{display:grid;gap:10px}
.person{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:12px;border-radius:14px;background:var(--bg);border:1px solid var(--line)}
.person strong{flex:1 1 120px;font-size:17px}
.person .btn,.person button{min-height:42px;font-size:15px;padding:0 14px}
.done{background:#1f7a3d!important}
.msg{padding:12px 14px;border-radius:12px;background:light-dark(#fdecee,#3a1219);color:var(--red2);font-weight:600;margin-top:12px}
.msg:empty{display:none}
.base{margin-top:14px;font-size:14px;color:var(--mute)}
.base input{width:100%;margin-top:6px;font-size:14px}
/* Reveal */
.reveal{min-height:100vh;display:grid;place-items:center;padding:32px 16px;background:var(--red);color:#fff;text-align:center}
.reveal h1{font-size:clamp(30px,7vw,46px)}
.ticket{width:min(340px,86vw);aspect-ratio:4/3;margin:28px auto;perspective:900px;cursor:pointer;border:0;background:none;padding:0;display:block}
.ticket .flap{position:absolute;inset:0;border-radius:6px;background:#fff8ec;box-shadow:0 18px 40px -14px rgba(0,0,0,.5);transform-origin:top;transition:transform .8s cubic-bezier(.2,.8,.2,1);display:grid;place-items:center;color:var(--red);font:600 20px Fraunces,serif;z-index:2;backface-visibility:hidden}
.ticket .flap::after{content:"";position:absolute;left:12px;right:12px;bottom:14px;border-top:2px dashed #e7c98d}
.ticket .inner{position:absolute;inset:0;border-radius:6px;background:#fff;color:#2a0c12;display:grid;place-content:center;gap:4px;padding:16px;box-shadow:0 18px 40px -14px rgba(0,0,0,.5)}
.ticket .inner small{color:#7a5a60;font-size:15px}
.ticket .inner .name{font:800 clamp(32px,9vw,46px)/1.05 Fraunces,serif;color:var(--red);overflow-wrap:anywhere}
.ticket{position:relative}
.ticket.open .flap{transform:rotateX(-178deg)}
.dogs{display:block;width:min(600px,100%);height:auto;margin:22px auto 0;position:relative;overflow:visible}
.reveal .dogs{width:min(420px,92vw);margin:0 auto 10px}
.budget{display:inline-block;margin-top:6px;padding:6px 14px;border-radius:999px;background:var(--gold);color:#2a0c12;font-weight:700}
.reveal p{max-width:36ch;margin:0 auto;opacity:.92}
@keyframes trot{50%{transform:translateY(-3px)}}
.run{animation:trot .5s ease-in-out infinite}
@media(prefers-reduced-motion:reduce){.ticket .flap{transition:none}.run{animation:none}}
</style>
</head>
<body>
<div id="app"></div>
<script>
{
// Link to this page once published (location.href is not the public URL inside the viewer)
const BASE = "https://claude.ai/artifact/RHPGjUR5imVmSPPbErtjoj";
const LS = "lootjes-v1";
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

// --- token: "gever\nontvanger", xor-scrambled with a random key, hex-encoded (not readable in the link)
const stream = k => { let x = (k[0] | k[1] << 8 | k[2] << 16 | k[3] << 24) >>> 0 || 1; return () => { x ^= x << 13; x >>>= 0; x ^= x >>> 17; x ^= x << 5; x >>>= 0; return x & 255; }; };
const hex = a => [...a].map(b => b.toString(16).padStart(2, "0")).join("");
function enc(giver, recv) {
  const b = new TextEncoder().encode(giver + "\n" + recv);
  const k = crypto.getRandomValues(new Uint8Array(4)), r = stream(k);
  let sum = 0; const out = [...k];
  for (const v of b) { sum = (sum + v) & 255; out.push(v ^ r()); }
  out.push(sum ^ r());
  return "lot" + hex(out);
}
function dec(t) {
  if (!/^lot([0-9a-f]{2}){6,}$/.test(t)) return null;
  const a = t.slice(3).match(/../g).map(h => parseInt(h, 16));
  const r = stream(a.slice(0, 4)); const b = []; let sum = 0;
  for (const v of a.slice(4, -1)) { const c = v ^ r(); b.push(c); sum = (sum + c) & 255; }
  if (((a[a.length - 1] ^ r()) & 255) !== sum) return null;
  const [giver, recv] = new TextDecoder().decode(new Uint8Array(b)).split("\n");
  return recv ? { giver, recv } : null;
}

// --- draw: everyone gives once, receives once, never self, never forbidden
function draw(names, banned) {
  const order = [...names].sort((a, b) => (banned[b]?.length || 0) - (banned[a]?.length || 0));
  const taken = new Set(), res = {};
  const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = crypto.getRandomValues(new Uint32Array(1))[0] % (i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const go = i => {
    if (i === order.length) return true;
    const g = order[i];
    for (const c of shuffle(names.filter(n => n !== g && !taken.has(n) && !(banned[g] || []).includes(n)))) {
      taken.add(c); res[g] = c;
      if (go(i + 1)) return true;
      taken.delete(c);
    }
    return false;
  };
  return go(0) ? res : null;
}

// --- state
let st = { names: [], banned: {}, both: true, links: null, sent: {}, base: BASE };
try { const s = JSON.parse(localStorage.getItem(LS)); if (s) st = { ...st, ...s, base: s.base || BASE }; } catch (e) {}
const save = () => { try { localStorage.setItem(LS, JSON.stringify(st)); } catch (e) {} };


// --- Pien en Soof trekken de arrenslee (zijaanzicht), x/y = midden van het lijf
function dog(x, y, o) {
  const leg = (lx, r, back) => `<rect x="${lx - 6}" y="8" width="12" height="28" rx="6" fill="${back ? o.legBack : o.leg}" transform="rotate(${r} ${lx} 10)"/>`;
  const fluff = o.fluffy ? [[50, -42], [58, -47], [67, -47], [75, -43], [-50, -10]].map(([a, b]) => `<circle cx="${a}" cy="${b}" r="6" fill="${o.fur}"/>`).join("") : "";
  return `<g class="run" style="animation-delay:${o.delay}s"><g transform="translate(${x} ${y})">
    <ellipse cx="6" cy="36" rx="64" ry="5" fill="rgba(0,0,0,.18)"/>
    <path d="M-54 -6 Q-72 -12 -80 -34" stroke="${o.fur}" stroke-width="8" stroke-linecap="round" fill="none"/>
    ${leg(-40, 22, 1)}${leg(36, -24, 1)}
    <ellipse cx="0" cy="0" rx="58" ry="22" fill="${o.fur}"/>${fluff}
    ${o.belly ? `<path d="M-30 12 Q0 24 44 10" stroke="${o.belly}" stroke-width="7" stroke-linecap="round" fill="none"/>` : ""}
    ${leg(-34, -18)}${leg(42, 22)}
    <path d="M36 -12 Q46 4 40 14" stroke="#e0a526" stroke-width="6" fill="none" stroke-linecap="round"/>
    <circle cx="41" cy="16" r="5" fill="#f3c64a" stroke="#b9861c" stroke-width="1.5"/>
    <path d="M-6 -20 Q-4 2 -10 20" stroke="#e0a526" stroke-width="6" fill="none" stroke-linecap="round"/>
    <path d="M40 -14 Q50 -26 58 -30" stroke="${o.fur}" stroke-width="18" stroke-linecap="round"/>
    <ellipse cx="62" cy="-30" rx="22" ry="19" fill="${o.fur}"/>
    <ellipse cx="84" cy="-21" rx="19" ry="11" fill="${o.muz}"/>
    <path d="M70 -14 Q80 6 96 -10Z" fill="${o.muz}"/><path d="M76 -6 l-2 8M84 -6v8" stroke="${o.muz}" stroke-width="3" stroke-linecap="round"/>
    <path d="M52 -44 Q40 -40 42 -16 Q44 -6 52 -10 Q56 -26 60 -38Z" fill="${o.ear}"/>
    <ellipse cx="72" cy="-41" rx="6" ry="3" fill="${o.brow}" transform="rotate(-15 72 -41)"/>
    <circle cx="72" cy="-34" r="3.6" fill="#1a0e08"/><circle cx="73.3" cy="-35.3" r="1.2" fill="#fff"/>
    ${o.tongue ? `<path d="M86 -10 Q90 2 94 -10Z" fill="#e8738f"/>` : ""}
    <circle cx="102" cy="-24" r="11" fill="#ff4b5c" opacity=".22" class="glow"/>
    <circle cx="102" cy="-24" r="7" fill="#e3182f"/><circle cx="99.6" cy="-26.4" r="2.2" fill="#fff" opacity=".85"/>
    <g transform="rotate(${o.tilt} 60 -48)"><path d="M44 -46 Q52 -76 82 -70 Q70 -60 76 -46Z" fill="#c8102e"/>
    <rect x="41" y="-50" width="38" height="9" rx="4.5" fill="#fff"/><circle cx="84" cy="-70" r="5" fill="#fff"/></g>
    <text x="10" y="58" text-anchor="middle" font-family="Figtree,sans-serif" font-weight="700" font-size="15" fill="#a3122a">${o.name}</text>
  </g></g>`;
}
const DOGS = `<svg class="dogs" viewBox="0 0 610 262" role="img" aria-label="Tekening van de teckels Soof en Pien met rode neusjes die de arrenslee van de kerstman trekken">
  <path d="M0 214 Q150 196 300 210 T610 206 V262 H0Z" fill="#fff" opacity=".95"/>
  ${[[30,30],[120,60],[210,20],[330,40],[420,18],[560,50],[540,110],[250,90]].map(([a,b],i)=>`<circle cx="${a}" cy="${b}" r="${1.6+i%3}" fill="#fff" opacity=".8"/>`).join("")}
  <path d="M166 140 L322 172M166 140 L517 172" stroke="#5a2a16" stroke-width="2.5" fill="none"/>
  <g>
    <path d="M18 218 H210 Q236 218 236 194" stroke="#e0a526" stroke-width="5" fill="none" stroke-linecap="round"/>
    <path d="M60 218 V198M170 218 V198" stroke="#e0a526" stroke-width="5"/>
    <path d="M44 92 Q30 100 34 126 Q60 112 88 126 Q96 100 80 90Z" fill="#7a4a24"/>
    <rect x="44" y="70" width="24" height="24" rx="3" fill="#2f8f5b"/><rect x="54" y="70" width="4" height="24" fill="#e0a526"/>
    <rect x="64" y="80" width="22" height="16" rx="3" fill="#e0a526"/><rect x="73" y="80" width="4" height="16" fill="#c8102e"/>
    <circle cx="150" cy="118" r="26" fill="#c8102e"/>
    <circle cx="150" cy="86" r="15" fill="#f6c9a8"/>
    <path d="M134 90 Q136 118 150 122 Q164 118 166 90 Q158 98 150 98 Q142 98 134 90Z" fill="#fff"/>
    <circle cx="145" cy="84" r="2" fill="#2a160c"/><circle cx="155" cy="84" r="2" fill="#2a160c"/><circle cx="150" cy="90" r="3.5" fill="#e98b7a"/>
    <path d="M134 76 Q140 50 168 52 Q160 60 166 76Z" fill="#c8102e"/><rect x="131" y="72" width="38" height="9" rx="4.5" fill="#fff"/><circle cx="170" cy="53" r="5" fill="#fff"/>
    <path d="M162 118 Q172 130 166 140" stroke="#c8102e" stroke-width="11" stroke-linecap="round" fill="none"/><circle cx="166" cy="141" r="6" fill="#fff"/>
    <path d="M26 118 Q26 200 78 200 H190 Q214 200 220 168 L226 122 Q200 136 176 136 Q120 136 26 118Z" fill="#b30f27"/>
    <path d="M26 118 Q120 136 176 136 Q200 136 226 122" stroke="#e0a526" stroke-width="5" fill="none" stroke-linecap="round"/>
    <path d="M60 160 q30 -14 60 0 q30 14 60 0" stroke="#e0a526" stroke-width="3" fill="none" opacity=".8"/>
  </g>
  ${dog(284, 170, {name: "Soof", fur: "#1f1815", leg: "#b8753c", legBack: "#94592a", belly: "#b8753c", muz: "#b8753c", ear: "#130d0b", brow: "#c98a4b", tongue: true, tilt: -10, delay: 0})}
  ${dog(478, 170, {name: "Pien", fur: "#e7c48a", leg: "#e7c48a", legBack: "#cfa86c", muz: "#f4dfb4", ear: "#d4a865", brow: "#f6e6c4", fluffy: true, tilt: 8, delay: .2})}
</svg>`;

const snow = `<svg class="snow" aria-hidden="true"><defs><g id="f"><path d="M0-9V9M-8-4.5 8 4.5M-8 4.5 8-4.5" stroke="#fff" stroke-width="1.6" stroke-linecap="round"/></g></defs>${[[8,30],[22,70],[40,22],[58,60],[74,28],[90,72],[96,20],[33,88],[66,92],[14,10]].map(([x,y],i)=>`<use href="#f" x="${x}%" y="${y}%" transform-origin="${x}% ${y}%" style="transform:scale(${.7+i%3*.4})"/>`).join("")}</svg>`;

function owner() {
  const n = st.names;
  $("#app").innerHTML = `
  <header>${snow}<h1>Lootjes trekken</h1><p>Vul de namen in, kies wie elkaar niet mag trekken en stuur iedereen een eigen link. Niemand ziet de trekking, jij ook niet.</p>${DOGS}</header>
  <main>
    <section class="card"><h2><span class="step">1</span>Wie doen er mee?</h2>
      <form id="add" class="row"><input id="nm" type="text" placeholder="Naam, bijv. Oma" autocomplete="off" aria-label="Naam"><button>Toevoegen</button></form>
      <div class="chips">${n.map((x, i) => `<span class="chip">${esc(x)}<button data-del="${i}" aria-label="Verwijder ${esc(x)}">×</button></span>`).join("")}</div>
      ${n.length < 3 ? `<p class="hint" style="margin:12px 0 0">Minstens 3 namen nodig.</p>` : ""}
    </section>
    ${n.length >= 3 ? `<section class="card"><h2><span class="step">2</span>Wie mag wie níet trekken?</h2>
      <p class="hint">Tik een naam aan om die uit te sluiten, bijvoorbeeld partners of wie elkaar vorig jaar had.</p>
      <label class="check"><input id="both" type="checkbox" ${st.both ? "checked" : ""}> Geldt voor beide kanten</label>
      ${n.map(g => `<div class="ex"><b>${esc(g)} mag niet trekken:</b><div class="row">${n.filter(o => o !== g).map(o => `<button class="tog" data-g="${esc(g)}" data-o="${esc(o)}" aria-pressed="${(st.banned[g] || []).includes(o)}">${esc(o)}</button>`).join("")}</div></div>`).join("")}
    </section>
    <section class="card"><h2><span class="step">3</span>Trekken en links versturen</h2>
      ${st.links ? `<p class="hint">Stuur elke persoon alleen zijn eigen link. Open zelf geen links van anderen, dan blijft het ook voor jou een verrassing.</p>
        <div class="out">${n.map(g => `<div class="person"><strong>${esc(g)}</strong>
          <a class="btn ${st.sent[g] ? "done" : ""}" data-wa="${esc(g)}" href="https://wa.me/?text=${encodeURIComponent(`Hoi ${g}! Hier is jouw lootje voor kerst 🎁 Klik om te zien wie je hebt getrokken (max €100): ${link(g)}`)}">WhatsApp</a>
          <button class="ghost" data-copy="${esc(g)}">Kopieer link</button></div>`).join("")}</div>
        <button class="ghost big" id="redo">Opnieuw trekken (oude links vervallen)</button>`
      : `<p class="hint">De computer trekt eerlijk en houdt rekening met je uitsluitingen. Je ziet daarna alleen per persoon een link, niet wie wie heeft.</p><button class="big" id="go">🎄 Trek de lootjes</button>`}
      <div class="msg" id="msg"></div>
      <div class="base">Link van deze pagina (wordt in elke uitnodiging gebruikt)<input id="base" type="text" value="${esc(st.base)}" placeholder="https://claude.ai/..."></div>
    </section>` : ""}
  </main>`;
  bind();
}
const link = g => (st.base || "").replace(/#.*$/, "") + "#" + st.links[g];

function bind() {
  $("#add").onsubmit = e => {
    e.preventDefault(); const v = $("#nm").value.trim();
    if (v && !st.names.some(x => x.toLowerCase() === v.toLowerCase())) { st.names.push(v); st.links = null; st.sent = {}; save(); owner(); $("#nm").focus(); }
    else $("#nm").select();
  };
  document.querySelectorAll("[data-del]").forEach(b => b.onclick = () => {
    const x = st.names.splice(+b.dataset.del, 1)[0]; delete st.banned[x];
    for (const k in st.banned) st.banned[k] = st.banned[k].filter(o => o !== x);
    st.links = null; st.sent = {}; save(); owner();
  });
  const both = $("#both"); if (both) both.onchange = () => { st.both = both.checked; save(); };
  document.querySelectorAll(".tog").forEach(b => b.onclick = () => {
    const { g, o } = b.dataset, on = b.getAttribute("aria-pressed") !== "true";
    const set = (a, c) => { const l = st.banned[a] = st.banned[a] || []; if (on && !l.includes(c)) l.push(c); if (!on) st.banned[a] = l.filter(x => x !== c); };
    set(g, o); if (st.both) set(o, g);
    st.links = null; st.sent = {}; save(); owner();
  });
  const go = $("#go"); if (go) go.onclick = () => {
    if (!st.base) { $("#msg").textContent = "Vul eerst hieronder de link van deze pagina in."; return; }
    const r = draw(st.names, st.banned);
    if (!r) { $("#msg").textContent = "Met deze uitsluitingen kan niet iedereen iemand trekken. Haal er een paar weg en probeer opnieuw."; return; }
    st.links = {}; for (const g of st.names) st.links[g] = enc(g, r[g]);
    st.sent = {}; save(); owner();
  };
  const redo = $("#redo"); if (redo) redo.onclick = () => { st.links = null; st.sent = {}; save(); owner(); };
  document.querySelectorAll("[data-copy]").forEach(b => b.onclick = async () => {
    const g = b.dataset.copy;
    try { await navigator.clipboard.writeText(link(g)); b.textContent = "Gekopieerd ✓"; st.sent[g] = 1; save(); }
    catch (e) { $("#msg").textContent = "Kopiëren lukte niet in deze browser. Gebruik de WhatsApp-knop."; }
  });
  document.querySelectorAll("[data-wa]").forEach(a => a.onclick = () => { st.sent[a.dataset.wa] = 1; save(); a.classList.add("done"); });
  const base = $("#base"); if (base) base.onchange = () => { st.base = base.value.trim(); save(); if (st.links) owner(); };
}

function reveal(d) {
  document.title = "Jouw lootje";
  $("#app").innerHTML = `<div class="reveal"><div>
    ${DOGS}
    <h1>Hoi ${esc(d.giver)}!</h1>
    <p>Pien en Soof hebben je lootje voor je getrokken.<br>Ben jij dit niet? Sluit deze pagina dan, dit lootje is voor iemand anders.</p>
    <button class="ticket" id="tk" aria-label="Open je lootje">
      <span class="inner"><small>Jij koopt een cadeautje voor</small><span class="name">${esc(d.recv)}</span><span><span class="budget">max €100</span></span></span>
      <span class="flap">Tik om te openen</span>
    </button>
    <p id="after" style="visibility:hidden">Niet verder vertellen! Je kunt deze link altijd opnieuw openen.</p>
  </div></div>`;
  $("#tk").onclick = () => { $("#tk").classList.add("open"); $("#after").style.visibility = "visible"; };
}

function route() {
  const t = location.hash.slice(1), d = t ? dec(t) : null;
  if (d) reveal(d);
  else if (t.startsWith("lot")) $("#app").innerHTML = `<div class="reveal"><div><h1>Oeps</h1><p>Deze link klopt niet helemaal. Vraag de organisator om je link opnieuw te sturen.</p></div></div>`;
  else owner();
}
addEventListener("hashchange", route);
route();
}
</script>
</body>
